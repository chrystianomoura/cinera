# Mantém as dependências atualizadas e avisa sobre falhas de segurança conhecidas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desenvolvimento:
        dependency-type: development
      producao:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
