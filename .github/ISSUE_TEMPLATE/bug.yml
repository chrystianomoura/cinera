name: Algo não funciona
description: Relate um erro, algo quebrado ou um comportamento estranho
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar! Se for uma **falha de segurança**, não use este formulário: siga a [política de segurança](https://github.com/chrystianomoura/cinera/security/policy).
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o problema. Se puder, inclua um print.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: Os passos, do início, e em qual página ou filme.
      placeholder: |
        1. Abrir cinera.party
        2. Clicar em ...
        3. Ver o erro
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: false
  - type: input
    id: ambiente
    attributes:
      label: Navegador e aparelho
      description: Por exemplo, "Safari 27 no iPhone", "Chrome no Windows".
    validations:
      required: false
